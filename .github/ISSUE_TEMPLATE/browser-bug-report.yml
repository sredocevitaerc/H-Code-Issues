name: Bug report (browser extension)
description: Report a reproducible problem with the H-Code browser extension for ChatGPT and Claude
title: "[Bug][Browser]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with the H-Code browser extension.
        Do not paste private chat content, access tokens, cookies, or other sensitive information.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Existing issues
      description: Check open and closed issues before creating a duplicate report.
      options:
        - label: I searched the existing issues and did not find this problem.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened. Include the exact text shown in the status bar at the bottom of the H-Code panel, if any.
      placeholder: After pressing Move, the chat stayed in Ongoing and the status bar showed...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open chatgpt.com and click H-Code
        2. Expand a project...
        3. Click...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected H-Code to do.
    validations:
      required: true

  - type: dropdown
    id: site
    attributes:
      label: Site
      options:
        - chatgpt.com
        - claude.ai
        - Both
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: H-Code version
      description: Shown on the browser's extensions page (for example chrome://extensions).
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Brave
        - Other Chromium browser
        - Firefox
        - Safari
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: Chrome 142.0.7444.60
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open the page's developer tools (F12), then Console, and paste lines starting with "H-Code". Remove sensitive information first.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots or any other details that may help. Blur private chat titles if needed.
