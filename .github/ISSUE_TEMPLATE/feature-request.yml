name: Feature request
description: Propose a new feature or an improvement for H-Code
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve H-Code. One idea per request makes it easier to discuss and track.

  - type: checkboxes
    id: existing-request
    attributes:
      label: Existing requests
      description: Check open and closed issues before proposing something that may already be planned or discussed.
      options:
        - label: I searched the existing issues and did not find this proposal.
          required: true

  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - H-Code browser extension (ChatGPT / Claude sidebar)
        - H-Code JetBrains IDE plugin
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to do, and what makes it hard today?
      placeholder: When I have many projects, I cannot quickly find...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how the feature should work from your point of view.
      placeholder: Add a search box above Projects that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this, or workarounds you use now.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, mock-ups, or examples. Remove private chat content, credentials, and other sensitive information.
