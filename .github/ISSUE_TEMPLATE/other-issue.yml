name: Other issue or question
description: Anything that is not a bug report, a feature request, or a security vulnerability
title: "[Issue]: "
labels:
  - question
body:
  - type: checkboxes
    id: existing-issue
    attributes:
      label: Existing issues
      description: Check open and closed issues before creating a duplicate.
      options:
        - label: I searched the existing issues and did not find this topic.
          required: true

  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - H-Code browser extension (ChatGPT / Claude sidebar)
        - H-Code JetBrains IDE plugin
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue or question. Remove credentials, tokens, private chat content, and other sensitive information.
    validations:
      required: true
